<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0d1117">
    <meta name="description" content="IPA Trainer - تعلم النطق الصحيح للأبجدية الصوتية الدولية">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>IPA Trainer | تعلم النطق الصحيح</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div id="splash" class="splash">
        <div class="splash-content">
            <div class="splash-logo"><i class="fas fa-microphone-alt"></i></div>
            <h1 class="splash-title">IPA Trainer</h1>
            <p class="splash-subtitle">الإصدار 2.0.0</p>
            <div class="splash-loader"><span></span><span></span><span></span></div>
        </div>
    </div>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <i class="fas fa-microphone-alt"></i>
                <span>IPA Trainer</span>
            </div>
            <button class="icon-btn" id="sidebarClose" aria-label="إغلاق">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="sidebar-content">
            <div class="sidebar-section">
                <div class="section-label"><i class="fas fa-compass"></i><span>التنقل</span></div>
                <nav class="sidebar-nav">
                    <button class="nav-item" data-page="home"><i class="fas fa-home"></i><span>الرئيسية</span></button>
                    <button class="nav-item" data-page="training"><i class="fas fa-dumbbell"></i><span>التدريب</span></button>
                    <button class="nav-item" data-page="quiz"><i class="fas fa-pen-to-square"></i><span>الاختبارات</span></button>
                    <button class="nav-item" data-page="dictionary"><i class="fas fa-book"></i><span>القاموس</span></button>
                    <button class="nav-item" data-page="history"><i class="fas fa-chart-line"></i><span>تقديمي</span></button>
                </nav>
            </div>
            <div class="sidebar-section">
                <div class="section-label"><i class="fas fa-palette"></i><span>المظهر</span></div>
                <div class="theme-switch">
                    <button class="theme-btn" data-theme="dark"><i class="fas fa-moon"></i><span>داكن</span></button>
                    <button class="theme-btn" data-theme="light"><i class="fas fa-sun"></i><span>فاتح</span></button>
                </div>
            </div>
            <div class="sidebar-section">
                <div class="section-label"><i class="fas fa-info-circle"></i><span>المعلومات</span></div>
                <nav class="sidebar-nav">
                    <button class="nav-item" data-page="about"><i class="fas fa-info-circle"></i><span>حول البرنامج</span></button>
                    <button class="nav-item" data-page="developer"><i class="fas fa-code"></i><span>حول المطور</span></button>
                    <button class="nav-item" data-page="contributors"><i class="fas fa-users"></i><span>المساهمون</span></button>
                    <button class="nav-item" data-page="support"><i class="fas fa-headset"></i><span>الدعم الفني</span></button>
                    <button class="nav-item" data-page="faq"><i class="fas fa-question-circle"></i><span>الأسئلة الشائعة</span></button>
                </nav>
            </div>
            <div class="sidebar-section">
                <div class="section-label"><i class="fas fa-file-alt"></i><span>السياسات</span></div>
                <nav class="sidebar-nav">
                    <button class="nav-item" data-page="privacy"><i class="fas fa-lock"></i><span>الخصوصية</span></button>
                    <button class="nav-item" data-page="terms"><i class="fas fa-file-contract"></i><span>الاستخدام</span></button>
                    <button class="nav-item" data-page="license"><i class="fas fa-certificate"></i><span>الترخيص</span></button>
                </nav>
            </div>
        </div>
        <div class="sidebar-footer">
            <div>المطور: محمد الباقر</div>
            <div class="footer-version">الإصدار 2.0.0</div>
            <div class="footer-copy">© 2025-2026</div>
        </div>
    </aside>

    <div class="app-shell">
        <header class="topbar">
            <div class="topbar-brand">
                <i class="fas fa-microphone-alt"></i>
                <div class="topbar-title">
                    <h1>IPA Trainer</h1>
                    <span>International Phonetic Alphabet</span>
                </div>
            </div>
            <div class="topbar-actions">
                <div class="stat-badge"><i class="fas fa-star"></i><span id="totalPoints">0</span></div>
                <div class="stat-badge level-badge"><i class="fas fa-seedling"></i><span id="userLevel">مبتدئ</span></div>
                <button class="icon-btn" id="menuToggle" aria-label="القائمة"><i class="fas fa-bars"></i></button>
            </div>
        </header>

        <main id="mainContent" class="main-content"></main>
    </div>

    <nav class="bottom-nav" id="bottomNav">
        <button class="bnav-item active" data-page="home"><i class="fas fa-home"></i><span>الرئيسية</span></button>
        <button class="bnav-item" data-page="training"><i class="fas fa-dumbbell"></i><span>التدريب</span></button>
        <button class="bnav-item" data-page="quiz"><i class="fas fa-pen-to-square"></i><span>الاختبارات</span></button>
        <button class="bnav-item" data-page="dictionary"><i class="fas fa-book"></i><span>القاموس</span></button>
        <button class="bnav-item" data-page="history"><i class="fas fa-chart-line"></i><span>تقديمي</span></button>
    </nav>

    <div id="dialogContainer"></div>
    <div id="toastContainer" class="toast-container"></div>

    <script>
        (function () {
            function hideSplash() {
                var splash = document.getElementById('splash');
                if (splash && !splash.classList.contains('hide')) {
                    splash.classList.add('hide');
                    setTimeout(function () { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 500);
                }
            }
            setTimeout(hideSplash, 6000);
            window.addEventListener('error', function () { setTimeout(hideSplash, 300); });
            window.addEventListener('unhandledrejection', function () { setTimeout(hideSplash, 300); });
            window.__hideSplash = hideSplash;
        })();
    </script>
    <script type="module" src="static/script.js"></script>
</body>
</html>
